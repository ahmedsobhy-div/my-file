<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="otp.css">
</head>
<body>
  <section>
    <div class="otp">
        <div class="container">
            <div class="div-1">
                <img src="../img/Mask group.png" alt="">
            </div>
            <div class="div-2">
                <div class="logo"><img src="../img/Logo-3.png" alt=""></div>
                <div class="h"><h1>Verify Your Account</h1></div>
                <div class="p"><p>Enter the 4-digit code sent to your phone or email.</p></div>
                <div class="squares">
                    <div class="square"></div>
                    <div class="square"></div>
                    <div class="square"></div>
                    <div class="square"></div>
                </div>
                <div class="time"><span>00:30</span></div>
                <div class="button"><a href="../reset/reset.html">Next</a></div>
                <div class="last">
                    <div class="no"><span>Didn’t receive OTP?</span></div>
                    <div class="resend"><a href="#">Send Again</a></div>
                </div>
            </div>
        </div>
    </div>
  </section>  
</body>
</html>
